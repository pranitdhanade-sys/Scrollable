
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Scrollable — Media Reels</title>

<style>
:root {
    --bg: #111111;
    --yellow: #f8df46;
    --pink: #ff5ca8;
    --border: 3px solid #000;
    --shadow: 5px 5px 0 #000;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#feed {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
}

#feed::-webkit-scrollbar {
    display: none;
}

.reel {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100dvh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #111;
    scroll-snap-align: start;
    scroll-snap-stop: always;
}

.reel img,
.reel video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

.reel video {
    background: #111;
}

.top-label {
    position: fixed;
    z-index: 20;
    top: max(16px, env(safe-area-inset-top));
    left: 20px;
    color: var(--yellow);
    font-size: 21px;
    font-weight: 1000;
    letter-spacing: -1px;
    text-shadow: 2px 2px #000;
    pointer-events: none;
}

.top-label span {
    color: var(--pink);
}

.counter {
    position: fixed;
    z-index: 20;
    top: max(16px, env(safe-area-inset-top));
    right: 20px;
    padding: 9px 14px;
    background: var(--yellow);
    color: #000;
    border: var(--border);
    box-shadow: var(--shadow);
    font-size: 12px;
    font-weight: 900;
    pointer-events: none;
}

.media-label {
    position: absolute;
    z-index: 5;
    left: 20px;
    bottom: max(22px, env(safe-area-inset-bottom));
    max-width: calc(100% - 100px);
    padding: 9px 12px;
    background: var(--pink);
    color: #000;
    border: var(--border);
    box-shadow: var(--shadow);
    font-size: 11px;
    font-weight: 900;
    overflow-wrap: anywhere;
    pointer-events: none;
}

.navigation {
    position: fixed;
    z-index: 30;
    right: 20px;
    bottom: max(25px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.navigation button {
    width: 42px;
    height: 42px;
    background: var(--yellow);
    color: #000;
    border: var(--border);
    box-shadow: var(--shadow);
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
}

.navigation button:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px #000;
}

#status {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 25px;
    background: #111;
    color: var(--yellow);
    text-align: center;
}

#status h1 {
    font-size: clamp(25px, 6vw, 45px);
    font-weight: 1000;
}

#status p {
    max-width: 450px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

#retry {
    padding: 12px 20px;
    background: var(--yellow);
    color: #000;
    border: var(--border);
    box-shadow: var(--shadow);
    font-weight: 900;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.media-error {
    max-width: 85%;
    padding: 25px;
    background: var(--pink);
    color: #000;
    border: var(--border);
    box-shadow: var(--shadow);
    font-weight: 900;
    text-align: center;
    overflow-wrap: anywhere;
}

@media (max-width: 767px) {
    .top-label {
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        font-size: 16px;
    }

    .counter {
        top: max(10px, env(safe-area-inset-top));
        right: 12px;
        padding: 7px 10px;
        font-size: 10px;
        box-shadow: 3px 3px #000;
    }

    .media-label {
        left: 12px;
        bottom: max(16px, env(safe-area-inset-bottom));
        padding: 7px 9px;
        font-size: 9px;
        box-shadow: 3px 3px #000;
    }

    .navigation {
        right: 12px;
        bottom: max(18px, env(safe-area-inset-bottom));
        gap: 8px;
    }

    .navigation button {
        width: 36px;
        height: 36px;
        font-size: 16px;
        box-shadow: 3px 3px #000;
    }
}

@media (prefers-reduced-motion: reduce) {
    #feed {
        scroll-behavior: auto;
    }
}
</style>
</head>

<body>

<div class="top-label">SCROLLABLE<span>.</span></div>

<div class="counter" id="counter">0 / 0</div>

<div id="status">
    <h1 id="statusTitle">LOADING MEDIA...</h1>
    <p id="statusMessage">Discovering images and videos from GitHub.</p>
    <button id="retry" class="hidden" onclick="loadMedia()">RETRY</button>
</div>

<main id="feed"></main>

<div class="navigation">
    <button onclick="navigate(-1)" aria-label="Previous media">↑</button>
    <button onclick="navigate(1)" aria-label="Next media">↓</button>
</div>

<script>

/* ==========================================
   REPOSITORY CONFIGURATION
========================================== */

const CONFIG = {
    owner: "pranitdhanade-sys",
    repository: "Scrollable",
    branch: "main",

    imageFolder: "assets/images/",
    videoFolder: "assets/videos/"
};

/* ==========================================
   SUPPORTED IMAGE FORMATS
========================================== */

const IMAGE_FORMATS = [
    "jpg",
    "jpeg",
    "png",
    "gif",
    "svg",
    "webp",
    "avif",
    "bmp",
    "tif",
    "tiff",
    "ico",
    "apng"
];

/* ==========================================
   SUPPORTED VIDEO FORMATS
========================================== */

const VIDEO_FORMATS = [
    "mp4",
    "webm",
    "mov",
    "m4v",
    "ogv",
    "ogg",
    "avi",
    "mpeg",
    "mpg",
    "3gp",
    "mkv"
];

/* ==========================================
   ELEMENTS
========================================== */

const feed = document.getElementById("feed");
const counter = document.getElementById("counter");
const statusBox = document.getElementById("status");
const statusTitle = document.getElementById("statusTitle");
const statusMessage = document.getElementById("statusMessage");
const retryButton = document.getElementById("retry");

/* ==========================================
   STATE
========================================== */

let media = [];
let reels = [];
let currentIndex = 0;
let observer = null;
let wheelLocked = false;

/* ==========================================
   IDENTIFY FILE TYPE
========================================== */

function identifyMedia(filename) {

    const cleanName = filename.split("?")[0];
    const extension = cleanName.split(".").pop().toLowerCase();

    if (IMAGE_FORMATS.includes(extension)) {
        return "image";
    }

    if (VIDEO_FORMATS.includes(extension)) {
        return "video";
    }

    return null;
}

/* ==========================================
   GENERATE RAW GITHUB URL
========================================== */

function getRawURL(path) {

    const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repository}/${CONFIG.branch}/${encodedPath}`;
}

/* ==========================================
   FETCH ENTIRE REPOSITORY TREE
========================================== */

async function discoverMedia() {

    const apiURL =
        `https://api.github.com/repos/` +
        `${CONFIG.owner}/${CONFIG.repository}/git/trees/` +
        `${CONFIG.branch}?recursive=1`;

    const response = await fetch(apiURL, {
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {
        throw new Error(
            `GitHub API error: ${response.status}. Check repository access and API rate limits.`
        );
    }

    const data = await response.json();

    if (!data.tree) {
        throw new Error("Could not read the repository file tree.");
    }

    if (data.truncated) {
        throw new Error(
            "GitHub returned an incomplete file tree. Reduce the repository size or use a generated media manifest."
        );
    }

    const discovered = [];

    data.tree.forEach(file => {

        if (file.type !== "blob") return;

        const path = file.path;

        const isImageFolder = path.startsWith(CONFIG.imageFolder);
        const isVideoFolder = path.startsWith(CONFIG.videoFolder);

        if (!isImageFolder && !isVideoFolder) return;

        const type = identifyMedia(path);

        if (!type) return;

        if (isImageFolder && type !== "image") return;
        if (isVideoFolder && type !== "video") return;

        discovered.push({
            name: path.split("/").pop(),
            path: path,
            type: type,
            src: getRawURL(path)
        });

    });

    discovered.sort((a, b) =>
        a.path.localeCompare(b.path, undefined, {
            numeric: true,
            sensitivity: "base"
        })
    );

    return discovered;
}

/* ==========================================
   CREATE MEDIA REEL
========================================== */

function createReel(item, index) {

    const reel = document.createElement("section");
    reel.className = "reel";
    reel.dataset.index = index;

    let element;

    if (item.type === "video") {

        element = document.createElement("video");

        element.src = item.src;
        element.controls = true;
        element.muted = true;
        element.loop = true;
        element.playsInline = true;
        element.preload = "metadata";

    } else {

        element = document.createElement("img");

        element.src = item.src;
        element.alt = item.name;
        element.draggable = false;
        element.decoding = "async";
        element.loading = index < 2 ? "eager" : "lazy";
    }

    element.addEventListener("error", () => {

        const error = document.createElement("div");

        error.className = "media-error";
        error.textContent = "UNABLE TO LOAD: " + item.name;

        reel.replaceChildren(error);
    });

    const label = document.createElement("div");

    label.className = "media-label";
    label.textContent =
        (item.type === "video" ? "▶ VIDEO · " : "IMAGE · ") +
        item.name;

    reel.appendChild(element);
    reel.appendChild(label);

    return reel;
}

/* ==========================================
   RENDER FEED
========================================== */

function renderFeed() {

    feed.innerHTML = "";
    reels = [];
    currentIndex = 0;

    if (media.length === 0) {

        showStatus(
            "NO MEDIA FOUND",
            "Upload images to assets/images/ and videos to assets/videos/ in your repository."
        );

        counter.textContent = "0 / 0";

        return;
    }

    const fragment = document.createDocumentFragment();

    media.forEach((item, index) => {

        const reel = createReel(item, index);

        reels.push(reel);
        fragment.appendChild(reel);
    });

    feed.appendChild(fragment);

    setupVideoObserver();

    statusBox.classList.add("hidden");

    updateCounter();
}

/* ==========================================
   VIDEO AUTO PLAY / PAUSE
========================================== */

function setupVideoObserver() {

    if (observer) {
        observer.disconnect();
    }

    observer = new IntersectionObserver(entries => {

        entries.forEach(entry => {

            const video = entry.target.querySelector("video");

            if (!video) return;

            if (
                entry.isIntersecting &&
                entry.intersectionRatio >= 0.65
            ) {

                video.play().catch(() => {});

            } else {

                video.pause();

            }

        });

    }, {
        root: feed,
        threshold: [0, 0.25, 0.65, 1]
    });

    reels.forEach(reel => {
        observer.observe(reel);
    });
}

/* ==========================================
   UPDATE MEDIA COUNTER
========================================== */

function updateCounter() {

    if (!reels.length) return;

    let closestIndex = 0;
    let smallestDistance = Infinity;

    reels.forEach((reel, index) => {

        const distance = Math.abs(
            reel.getBoundingClientRect().top
        );

        if (distance < smallestDistance) {
            smallestDistance = distance;
            closestIndex = index;
        }

    });

    currentIndex = closestIndex;

    counter.textContent =
        `${currentIndex + 1} / ${reels.length}`;
}

feed.addEventListener("scroll", updateCounter, {
    passive: true
});

/* ==========================================
   NAVIGATION
========================================== */

function navigate(direction) {

    if (!reels.length) return;

    const nextIndex = Math.max(
        0,
        Math.min(currentIndex + direction, reels.length - 1)
    );

    reels[nextIndex].scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener("keydown", event => {

    if (
        event.target.tagName === "INPUT" ||
        event.target.tagName === "TEXTAREA"
    ) return;

    if (
        event.key === "ArrowDown" ||
        event.key === "PageDown"
    ) {
        event.preventDefault();
        navigate(1);
    }

    if (
        event.key === "ArrowUp" ||
        event.key === "PageUp"
    ) {
        event.preventDefault();
        navigate(-1);
    }

    if (event.key === "Home") {
        reels[0]?.scrollIntoView({
            behavior: "smooth"
        });
    }

    if (event.key === "End") {
        reels[reels.length - 1]?.scrollIntoView({
            behavior: "smooth"
        });
    }

});

/* ==========================================
   MOUSE WHEEL NAVIGATION
========================================== */

feed.addEventListener("wheel", event => {

    if (wheelLocked) return;
    if (Math.abs(event.deltaY) < 10) return;

    wheelLocked = true;

    navigate(event.deltaY > 0 ? 1 : -1);

    setTimeout(() => {
        wheelLocked = false;
    }, 650);

}, { passive: true });

/* ==========================================
   LOADING / ERROR STATUS
========================================== */

function showStatus(title, message, retry = false) {

    statusTitle.textContent = title;
    statusMessage.textContent = message;

    retryButton.classList.toggle(
        "hidden",
        !retry
    );

    statusBox.classList.remove("hidden");
}

/* ==========================================
   LOAD ALL MEDIA
========================================== */

async function loadMedia() {

    showStatus(
        "SCANNING REPOSITORY...",
        "Finding every image and video in your asset folders."
    );

    retryButton.classList.add("hidden");

    try {

        media = await discoverMedia();

        console.log("Discovered media:", media);

        renderFeed();

    } catch (error) {

        console.error(error);

        showStatus(
            "FAILED TO LOAD MEDIA",
            error.message,
            true
        );
    }
}

/* ==========================================
   START
========================================== */

loadMedia();

</script>

</body>
</html>
